name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo PR / branch para economizar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Versão do Flutter fixada: `channel: stable` sem pin passou a resolver um SDK onde
# `IconData` é `final class`, quebrando lucide_icons_flutter 1.x (`extends IconData`)
# e, por tabela, a compilação de todos os testes. 3.41.2 é o baseline testado da lib
# e do app do promotor. Rever ao subir lucide para a linha 2.x/3.x.
env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  lib:
    name: archbase_flutter (lib)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Pub get
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Analyze
        # Escopado à lib (os adapters têm jobs próprios com pub get + analyze).
        # `flutter analyze` sem args desce nos subpacotes packages/* não resolvidos
        # pelo pub get da raiz e falha com "package:get não existe".
        run: flutter analyze lib test example/lib 2>&1 | tee analyze.log

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analyze-log
          path: analyze.log
          retention-days: 7

      - name: Test
        run: flutter test --coverage --reporter=expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lib
          path: coverage/lcov.info
          retention-days: 14

  adapter-riverpod:
    name: archbase_flutter_riverpod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lib
    steps:
      - uses: actions/checkout@v5
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: packages/archbase_flutter_riverpod
        run: flutter pub get
      - name: Analyze
        working-directory: packages/archbase_flutter_riverpod
        run: flutter analyze
      - name: Test
        working-directory: packages/archbase_flutter_riverpod
        run: flutter test

  adapter-getx:
    name: archbase_flutter_getx
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lib
    steps:
      - uses: actions/checkout@v5
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: packages/archbase_flutter_getx
        run: flutter pub get
      - name: Analyze
        working-directory: packages/archbase_flutter_getx
        run: flutter analyze
      - name: Test
        working-directory: packages/archbase_flutter_getx
        run: flutter test

  demo:
    name: archbase_demo (analyze + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lib
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get (demo)
        working-directory: demo
        run: flutter pub get

      - name: Analyze (demo)
        working-directory: demo
        run: flutter analyze

      - name: Test (demo smoke)
        working-directory: demo
        run: flutter test

  build-android:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        working-directory: demo
        run: flutter pub get

      - name: Build APK
        working-directory: demo
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: archbase-demo-debug-apk
          path: demo/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
